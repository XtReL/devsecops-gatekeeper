name: Security & Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Actions закреплены на полных SHA коммитов (тег в комментарии): перенос тега не меняет то, что выполняется в CI.
permissions:
  contents: read

jobs:
  audit-and-lint:
    name: Security Audit & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: true

      # 1. Сканирование на утечку секретов
      - name: GitGuardian Shield Scan
        uses: GitGuardian/ggshield-action@7f66d3be9c59a821dcf4f45ee5d929203a1a0b90 # v1.55.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      # 2. Превентивный ИБ-анализ кода (SAST)
      - name: Run Gosec Security Scanner
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: '-exclude=G104,G108 ./...'

      # [NEW FIX]: Принудительно скачиваем библиотеки перед линтером
      - name: Download Go Modules
        run: go mod download

      # 3. Строгий контроль качества кода (Native Toolchain)
      - name: Native Go Linting & Vet
        run: |
          # Проверка, а не исправление: CI падает, если код не отформатирован
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...

      # 4. ADR 0001 запрещает два триггера во всём репозитории (передают токен
      # установки через данные из непроверенного кода PR, см. "Связанное" в ADR).
      # Слова собираются из частей, а не пишутся литералом в этом файле, чтобы
      # шаг не находил сам себя при поиске по некомментарным строкам, и чтобы
      # сообщение об ошибке их тоже не содержало.
      - name: Forbid dangerous workflow triggers
        run: |
          set -euo pipefail
          w1="workflow"; w1="${w1}_run"
          w2="pull_request"; w2="${w2}_target"
          pattern="${w1}|${w2}"

          hit=0
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if grep -vE '^[[:space:]]*#' "$f" | grep -qE "$pattern"; then
              echo "::error file=$f::forbidden CI trigger keyword found (see ADR 0001)"
              hit=1
            fi
          done

          if [ "$hit" -ne 0 ]; then
            exit 1
          fi

  test-and-build:
    name: Compile & Execute Verification Tests
    needs: audit-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: true

      # Запуск тестов на моковых переменных
      - name: Execute Deterministic Unit Tests
        env:
          STRIPE_WEBHOOK_SECRET: "whsec_mock_secret_for_ci_testing"
          SPICEDB_TOKEN: "mock_key"
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/db?sslmode=disable"
        run: |
          go test -v -race -timeout 30s ./...

      # Проверка компиляции финального бинарника для Production
      - name: Verify Production Compilation
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o ./bin/gateway ./cmd/api/main.go

      # go test не встраивает список модульных зависимостей в собранный
      # тестовый бинарник (runtime/debug.ReadBuildInfo видит 0 deps), поэтому
      # поле gitleaksVersion в result.json проверяется здесь, на настоящем
      # бинарнике из go build/go run, а не юнит-тестом internal/engine.
      - name: Verify gitleaks version is embedded in scan result
        run: |
          set -euo pipefail
          expected="$(go list -m -f '{{.Version}}' github.com/zricethezav/gitleaks/v8)"
          out="${RUNNER_TEMP:-/tmp}/gatekeeper-selfscan.json"

          # Exit code may be 0 (clean) or 1 (findings); only a real error (2) is fatal here.
          set +e
          go run ./cmd/gatekeeper scan --source . --out "$out"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::gatekeeper scan exited with code $code"
            exit 1
          fi

          actual="$(sed -n 's/.*"gitleaksVersion": *"\([^"]*\)".*/\1/p' "$out" | head -n1)"
          echo "expected=$expected actual=$actual"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::gitleaksVersion in result.json ($actual) does not match go.mod ($expected)"
            exit 1
          fi