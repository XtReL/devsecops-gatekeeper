# Шаблон workflow для клиента Gatekeeper (ADR 0003).
#
# Скопируйте этот файл в .github/workflows/gatekeeper.yml вашего репозитория
# и замените <FULL_SHA> на полный SHA нужного релиза Gatekeeper Action —
# см. docs/onboarding.md. Перед этим выполните одноразовую настройку из
# docs/onboarding.md: ключ Ed25519, environment gatekeeper-evidence,
# секрет GATEKEEPER_SIGNING_KEY, orphan-ветка gatekeeper-evidence, ruleset.
#
# Оба задания — на ubuntu-latest (бинарник gatekeeper собирается под ОС
# раннера в задании scan и передаётся в record артефактом).
name: Gatekeeper

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scan.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Без секретов: собирает gatekeeper из исходников этого action по
      # закреплённому SHA (ADR 0003, v1 — вариант B).
      - name: Build gatekeeper
        id: build
        uses: XtReL/devsecops-gatekeeper@<FULL_SHA> # <TAG>
        with:
          mode: build

      # Не падает при находках: решение принимает следующий шаг ("Fail if
      # scan found leaks or errored"), после того как результат выгружен
      # артефактом.
      - name: Scan
        id: scan
        uses: XtReL/devsecops-gatekeeper@<FULL_SHA> # <TAG>
        with:
          mode: scan
          gatekeeper: ${{ steps.build.outputs.gatekeeper }}

      # Бинарник и result.json — одним артефактом: задание record ниже
      # скачивает оба и не пересобирает gatekeeper из исходников.
      - name: Upload scan result and binary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gatekeeper-result
          path: |
            ${{ steps.scan.outputs.result }}
            ${{ steps.build.outputs.gatekeeper }}

      - name: Fail if scan found leaks or errored
        if: steps.scan.outputs.code != '0'
        run: |
          code="${{ steps.scan.outputs.code }}"
          if [ "$code" = "1" ]; then
            echo "::error::gatekeeper scan found leaked secrets (see the gatekeeper-result artifact)"
          else
            echo "::error::gatekeeper scan failed with exit code $code"
          fi
          exit 1

  record:
    name: Record evidence
    needs: scan
    # Запись — только при push в ветку по умолчанию (ADR 0001, решение A);
    # находки (code == '1') тоже записываются, падает только реальная
    # ошибка сканера (code == '2', уже красное задание scan выше).
    if: always() && (needs.scan.outputs.code == '0' || needs.scan.outputs.code == '1') && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # environment ограничивает секрет GATEKEEPER_SIGNING_KEY веткой по
    # умолчанию — см. docs/onboarding.md.
    environment: gatekeeper-evidence
    permissions:
      contents: write
    steps:
      # Нужен .gatekeeper/evidence.json из репозитория.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download scan result and binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatekeeper-result
          path: ${{ runner.temp }}

      # Без ключа: только вычисляет ветку журнала для текущей эпохи.
      - name: Resolve evidence target
        id: target
        uses: XtReL/devsecops-gatekeeper@<FULL_SHA> # <TAG>
        with:
          mode: target
          gatekeeper: ${{ runner.temp }}/gatekeeper

      # До шага с ключом и отдельно от рабочего каталога (ADR 0003): ключ
      # не должен оказаться в окружении стороннего checkout.
      - name: Checkout evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.branch }}
          path: evidence
          persist-credentials: true
          fetch-depth: 0

      # Ключ — только в env этого шага (ADR 0003): установки Go, загрузки
      # модулей и сборки в этом задании нет вовсе; выполняются только уже
      # собранный бинарник и evidence-push.sh.
      - name: Record evidence
        uses: XtReL/devsecops-gatekeeper@<FULL_SHA> # <TAG>
        with:
          mode: record
          gatekeeper: ${{ runner.temp }}/gatekeeper
          result: ${{ runner.temp }}/result.json
          evidence: evidence
        env:
          GATEKEEPER_SIGNING_KEY: ${{ secrets.GATEKEEPER_SIGNING_KEY }}
